<!DOCTYPE html>
<html>
<head>
<title>Travel Blog</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto:wght@300;500&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#eef8ff;
    font-family:Roboto,sans-serif;
}

nav{
    background: rgb(243, 177, 85);
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-family:Pacifico;
    color:white;
    font-size:28px;
}

nav ul{
    list-style:none;
    display:flex;
}

nav ul li{
    margin-left:25px;
}

nav ul li a{
    text-decoration:none;
    color:white;
    font-weight:bold;
}

nav ul li a:hover{
    color:#ffe600;
}

.hero{
    height:400px;
    background:url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1200") center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
}

.hero::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.4);
}

.hero-text{
    position:relative;
    color:white;
}

.hero-text h1{
    font-size:50px;
    font-family:Pacifico;
}

.hero-text p{
    font-size:20px;
}

.heading{
    text-align:center;
    margin:35px;
    color:#faa930;
}

.container{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:25px;
    padding-bottom:40px;
}

.card{
    width:280px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 6px 15px rgba(0,0,0,.2);
    transition:.4s;
}


.card:hover{
    transform:rotate(-2deg) scale(1.05);
}

.card img{
    width:100%;
    height:180px;
    transition:.4s;
}

.card:hover img{
    transform:scale(1.1);
}

.content{
    padding:18px;
}

.content h3{
    color:#ff9355;
    margin-bottom:10px;
}

.content h3::after{
    content:" ";
}

.content p{
    color:#555;
}
</style>

</head>

<body>

<nav>
    <div class="logo">TravelGo</div>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Trips</a></li>
        <li><a href="#">Gallery</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>

<div class="hero">
    <div class="hero-text">
        <h1>Discover New Places</h1>
        <p>Adventure Begins With One Journey</p>
    </div>
</div>

<h2 class="heading">Featured Destinations</h2>

<div class="container">

    <div class="card">
        <img src="C:\Users\user\OneDrive\Pictures\images (2).jpg">
        <div class="content">
            <h3>Bali</h3>
            <p>Relax on tropical beaches and enjoy nature.</p>
        </div>
    </div>

    <div class="card">
        <img src="C:\Users\user\OneDrive\Pictures\iStock-1473162213-MOBILE-HEADER.webp">
        <div class="content">
            <h3>Dubai</h3>
            <p>Explore luxury shopping and modern architecture.</p>
        </div>
    </div>

    <div class="card">
        <img src="C:\Users\user\OneDrive\Pictures\images (3).jpg">
        <div class="content">
            <h3>Japan</h3>
            <p>Experience cherry blossoms and rich traditions.</p>
        </div>
    </div>

</div>

</body>
</html>
